name: motech_billing
description: نظام فواتير الكهرباء — شركة العباسي لتوليد الطاقة الكهربائية
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (SQLite)
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.42

  # Navigation
  go_router: ^17.2.3

  # PDF + printing / sharing
  pdf: ^3.12.0
  printing: ^5.14.3

  # Platform services
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  file_picker: ^11.0.3
  shared_preferences: ^2.5.5
  path: ^1.9.1
  sqlite3: ^2.4.6

  # صلاحيات التخزين + فتح الروابط الخارجية
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  device_info_plus: ^11.2.0

  # Utilities & UI
  intl: 0.20.2
  fl_chart: ^1.2.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    # خط واجهة التطبيق
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

    # خط الفاتورة — Amiri، خط نَسخي طباعي كلاسيكي مخصص للمستندات الرسمية
    # والفواتير. يغطي العربي + Arabic Presentation Forms-B (140) + الترقيم
    # اللاتيني «- / —» + الأرقام 10/10، فلا يحتاج خطاً احتياطياً.
    # مُقلَّص بـ fontTools من 431 KB إلى 291 KB.
    - family: AmiriInvoice
      fonts:
        - asset: assets/fonts/AmiriInvoice-Regular.ttf
          weight: 400
        - asset: assets/fonts/AmiriInvoice-Bold.ttf
          weight: 700

    # خط احتياطي للمحارف اللاتينية والترقيم داخل الفاتورة.
    # Noto Naskh Arabic لا يغطي «-» و «/» و «—» ⇒ لولا هذا لظهرت فراغات.
    # Tinos متوافق مترياً مع Times، وأرقام الفاتورة الأصلية سيريف.
    # مُقلَّص إلى Latin+Punctuation فقط (20 KB لكل ملف بدلاً من 550 KB).
    - family: TinosLatin
      fonts:
        - asset: assets/fonts/TinosLatin-Regular.ttf
          weight: 400
        - asset: assets/fonts/TinosLatin-Bold.ttf
          weight: 700
